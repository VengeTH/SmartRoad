version: "3.8"

# * SmartRoad Backend Services
# * Unified Docker Compose for all backend services
# * 
# * Services:
# * - graphhopper: Self-hosted routing engine
# * - api: SmartRoad API (placeholder - not implemented in MVP)

services:
  # * GraphHopper Routing Engine
  # * Self-hosted routing service for motorcycle navigation
  graphhopper:
    # * Using pre-built image (no build step needed)
    image: ghcr.io/gis-ops/docker-graphhopper:latest
    container_name: smartroad-graphhopper
    ports:
      - "8989:8989"  # GraphHopper API
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g
      - SCRIPT=web
      - PBF_URL=https://download.geofabrik.de/asia/philippines-latest.osm.pbf
      - PROFILES=motorcycle,car,truck,foot
      - PROFILES_CH=motorcycle,car
      - GRAPHOPPER_PROFILE_MOTORCYCLE=fastest
      - GRAPHOPPER_PROFILE_CAR=fastest
      - GRAPHOPPER_PROFILE_TRUCK=fastest
      - GRAPHOPPER_PROFILE_FOOT=shortest
      - GRAPHOPPER_AVOID_TOLL=true
      - GRAPHOPPER_GRAPHCACHE=mmap
      - GRAPHOPPER_WEB_CORS=*
      - GRAPHOPPER_WEB_ACCESS=*
      - GRAPHOPPER_CUSTOM_PROFILES=delivery_rider,flood_safe,weather_safe,hoa_access
      - GRAPHOPPER_ELEVATION=false
      - GRAPHOPPER_MAX_VISIT_DISTANCE=1000
    volumes:
      - graphhopper-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - smartroad-backend

  # * SmartRoad API Service
  # * FUTURE FEATURE - Not implemented in MVP
  # * This will be the main backend API for the SmartRoad app
  # * 
  # * When implemented, this service will:
  # * - Handle user authentication
  # * - Process route requests (calling GraphHopper)
  # * - Apply business logic (permissions, HOA restrictions)
  # * - Manage hazard data
  # * - Handle route selling logic
  #
  # api:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile
  #   container_name: smartroad-api
  #   ports:
  #     - "3000:3000"  # API port
  #   environment:
  #     - NODE_ENV=development
  #     - GRAPHHOPPER_URL=http://graphhopper:8989
  #     - DATABASE_URL=postgresql://user:pass@postgres:5432/smartroad
  #   volumes:
  #     - ./api:/app
  #     - /app/node_modules
  #   depends_on:
  #     - graphhopper
  #     - postgres
  #   networks:
  #     - smartroad-backend
  #   restart: unless-stopped

  # * PostgreSQL Database + PostGIS
  # * Stores all SmartRoad data (users, routes, hazards, stickers, etc.)
  # * PostGIS extension enables geospatial queries
  # * 
  # * To initialize, apply schema:
  # *   cat supabase_schema_merged.sql | docker exec -i smartroad-postgres psql -U smartroad -d smartroad
  # * 
  # * Supabase is used for cloud deployments; this local Postgres is for
  # * self-hosted setups or local development without Supabase.
  postgres:
    image: postgis/postgis:15-3.4
    container_name: smartroad-postgres
    environment:
      - POSTGRES_DB=smartroad
      - POSTGRES_USER=smartroad
      - POSTGRES_PASSWORD=${PG_PASSWORD:-smartroad_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - smartroad-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartroad -d smartroad"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # * Redis Cache
  # * Used for:
  # * - Session caching
  # * - Weather data TTL cache
  # * - Rate limiting counters
  # * - Realtime pub/sub (future)
  redis:
    image: redis:7-alpine
    container_name: smartroad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartroad-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  graphhopper-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  smartroad-backend:
    driver: bridge

